<!doctype html>
<!-- WAAPI motion beside SVG animated with SMIL (design-vault#60). -->
<html><body>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<svg width="100" height="100"><circle id="dot" cx="10" cy="50" r="8"><animate attributeName="cx" from="10" to="90" dur="1s" repeatCount="indefinite"/></circle></svg>
<script>
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
