<!doctype html>
<!-- WAAPI motion beside an animation the page plays in reverse (design-vault#60). #back's fill keeps it in
     getAnimations() once finished, so the collector's first scan, late on a loaded machine, still finds it (#351). -->
<html><body>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<div id="back" style="width:40px;height:40px;background:#333"></div>
<script>document.getElementById("back").animate([{ transform: "translateX(0)" }, { transform: "translateX(300px)" }], { duration: 400, fill: "backwards" }).reverse();</script>
<script>
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
