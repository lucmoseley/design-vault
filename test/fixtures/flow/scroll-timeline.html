<!doctype html>
<!-- WAAPI motion beside a CSS animation driven by scroll position (design-vault#60). -->
<html><body>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<style>@keyframes grow { to { width: 400px; } } #bar { height: 10px; width: 0; background: #333; animation: grow linear; animation-timeline: scroll(); } body { height: 3000px; }</style>
<div id="bar"></div>
<script>
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
