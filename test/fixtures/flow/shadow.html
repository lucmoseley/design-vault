<!doctype html>
<!-- WAAPI motion beside an element with shadow DOM (design-vault#60). -->
<html><body>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<div id="host"></div>
<script>document.getElementById("host").attachShadow({ mode: "open" }).innerHTML = "<p>inside</p>";</script>
<script>
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
