<div id="box" style="width:40px;height:40px;background:#333"></div>
<iframe id="frame" srcdoc="<p>hi</p>" width="200" height="100"></iframe>
<object id="doc" data="data:text/html,hi" width="200" height="100"></object>

</script>
</body></html>
