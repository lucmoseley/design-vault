<!doctype html>
<!-- WAAPI motion beside a box a scroll handler moves, on a page under two screens tall (design-vault#60). -->
<html><body>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<style>body { height: 1500px; }</style>
<div id="follow" style="width:40px;height:40px;background:#333"></div>
<script>addEventListener("scroll", () => { document.getElementById("follow").style.transform = "translateY(" + scrollY / 2 + "px)"; });</script>
<script>
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
