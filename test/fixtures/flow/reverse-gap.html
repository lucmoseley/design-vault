<!doctype html>
<!-- A reversed animation that ends between two frames, as on a loaded machine (#359). The reverse and the long
     task run as one task between two frames, so the next frame queues behind it, keeps its time and starts
     #back while it waits, missing from getAnimations(); the frame after comes 700 ms on, past #back's 400 ms.
     A fill would keep #back listed once ended, as reverse.html's does, and hide the miss. -->
<html><body>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<div id="back" style="width:40px;height:40px;background:#333"></div>
<script>
requestAnimationFrame(() => setTimeout(() => {
  document.getElementById("back").animate([{ transform: "translateX(0)" }, { transform: "translateX(300px)" }], { duration: 400 }).reverse();
  const t = performance.now();
  while (performance.now() - t < 700);
}));
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
