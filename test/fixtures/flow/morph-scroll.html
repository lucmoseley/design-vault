<!doctype html>
<!-- A morph scrolling drives (design-vault#72): a scroll handler sets the arch's
     d from the scroll position, so the morph has no timeline to measure. -->
<html><body style="height: 3000px">
<svg width="320" height="320" viewBox="0 0 320 320" style="position: fixed; top: 0">
  <path id="arch" fill="#333" d="M 0 300 C 0 233 0 167 0 100 C 0 45 45 0 100 0 C 155 0 200 45 200 100 C 200 167 200 233 200 300 C 133 300 67 300 0 300 Z"/>
</svg>
<script>
const path = document.getElementById("arch");
const from = path.getAttribute("d").split(" ");
const to = "M 0 300 C 0 283 0 267 0 250 C 0 167 67 100 150 100 C 233 100 300 167 300 250 C 300 267 300 283 300 300 C 200 300 100 300 0 300 Z".split(" ");
addEventListener("scroll", () => {
  const p = scrollY / (document.documentElement.scrollHeight - innerHeight);
  path.setAttribute("d", from.map((a, i) => (isNaN(a) ? a : (+a + (to[i] - a) * p).toFixed(2))).join(" "));
});
</script>
</body></html>
