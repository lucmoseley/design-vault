<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A script animation a slow screen still runs</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  .pulse { width: 40px; height: 40px; margin: 40px; background: #1d4ed8; }
</style>
</head>
<body>
<!-- vault.slow-update: an endless script animation that never asks (update: fast). -->
<div class="pulse" data-record="vault.slow-update"></div>
<script>
  document.querySelector('.pulse').animate([{ opacity: 1 }, { opacity: 0.6 }], { duration: 1000, iterations: Infinity, direction: 'alternate' });
</script>
</body>
</html>
