<!doctype html>
<!-- WAAPI motion beside a video (design-vault#60). -->
<html><body>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<video id="clip" width="200" height="100"></video>
<script>
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
