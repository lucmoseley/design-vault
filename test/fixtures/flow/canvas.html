<!doctype html>
<!-- WAAPI motion beside a canvas the sampler cannot see into (design-vault#60). -->
<html><body>
<canvas id="stage" width="200" height="100"></canvas>
<div id="box" style="width:40px;height:40px;background:#333"></div>
<script>
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
