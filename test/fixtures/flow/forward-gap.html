<!doctype html>
<!-- Forward fill-none animations that end between two frames (#369). Each starts in a ResizeObserver callback,
     which runs after the frame's scans, with LEFT ms of its MS: drawn in that frame, ended by the next. Only a
     read from Python between the two frames would list one, so five, started GAP ms apart, are missed together
     on every run. They cross a transform the compositor runs with a margin the main thread runs, and the last
     is followed by a long task, so the frame after it comes late. GAP and the first start's 100 ms are
     guesses, past the page's first frames and apart from each other's frames. LONG outlasts MS, so the late
     frame could not list the animation even if it were stamped the real time. -->
<html><head><style>
@keyframes slide { from { transform: translateX(0) } to { transform: translateX(300px) } }
@keyframes nudge { from { margin-left: 0 } to { margin-left: 300px } }
div { width: 40px; height: 40px; background: #333 }
</style></head><body>
<div id="box"></div>
<div id="a1"></div><div id="a2"></div><div id="c1"></div><div id="c2"></div><div id="late"></div>
<script>
const MS = 400, LEFT = 5, GAP = 170, LONG = 700;
const byAnimate = (prop, from, to) => (el) =>
  el.animate([{ [prop]: from }, { [prop]: to }], { duration: MS, delay: LEFT - MS });
const byCss = (name) => (el) => { el.style.animation = `${name} ${MS}ms linear ${LEFT - MS}ms`; };
const longTask = () => setTimeout(() => { const t = performance.now(); while (performance.now() - t < LONG); });
const margin = byAnimate("marginLeft", "0px", "300px");
const starts = [
  ["a1", byAnimate("transform", "translateX(0)", "translateX(300px)")],
  ["a2", margin],
  ["c1", byCss("slide")],
  ["c2", byCss("nudge")],
  ["late", (el) => { margin(el); longTask(); }],
];
starts.forEach(([id, start], k) => setTimeout(() => new ResizeObserver((_, ro) => {
  ro.disconnect();
  start(document.getElementById(id));
}).observe(document.getElementById(id)), 100 + GAP * k));
document.getElementById("box").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
</script>
</body></html>
