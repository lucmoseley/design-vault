<!doctype html>
<!-- A second move a timer starts 800 ms after the first (design-vault#547):
     past check-frames.py's QUIET_MS, so the scrub has read the timeline
     before #b starts and refuses the page rather than leave #b still or
     playing live. Under twice QUIET_MS, so the scrub is still watching when
     it starts. -->
<html><head><style>
body { margin: 0; background: #ffffff; }
div { position: absolute; left: 0; width: 40px; height: 40px; background: #000000; }
#a { top: 40px; }
#b { top: 120px; }
</style></head>
<body>
<div id="a"></div>
<div id="b"></div>
<script>
const move = (id) => document.getElementById(id).animate(
  [{ transform: "none" }, { transform: "translateX(1000px)" }], { duration: 2000, fill: "both" });
move("a").ready.then(() => setTimeout(() => move("b"), 800));
</script>
</body></html>
