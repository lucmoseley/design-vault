<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostel</title>
<style>
body { font: 16px/1.5 sans-serif; }
.phone-nav { display: none; }
@media (max-width: 600px) { .wide-nav { display: none; } .phone-nav { display: block; } }
.lead { font-weight: bold; font-size: 28px; }
</style></head>
<body>
<header>
<!-- fault: vault.logo-link-name: the logo's home link has no name; its part selector names the image, so the link is reached through it -->
<a href="index.html" data-fault="vault.logo-link-name"><img class="logo" src="logo.svg" alt=""></a>
<nav class="wide-nav" aria-label="Main"><a href="rooms.html">Rooms</a> <a href="about.html">About</a></nav>
<!-- fault: vault.label-in-name: the link's name leaves out its visible label, at phone width alone -->
<nav class="phone-nav" aria-label="Phone"><a href="rooms.html" aria-label="Accommodation" data-fault="vault.label-in-name">Rooms</a> <a href="about.html">About</a></nav>
</header>
<main>
<h1>Hostel</h1>
<!-- fault: vault.heading-markup: a paragraph styled as a heading -->
<p class="lead" data-fault="vault.heading-markup">Rooms</p>
<p>Dorms and private rooms a short walk from the beach, each with its own lockers and reading lights.</p>
<!-- fault: vault.lang-parts: a lang that names no language -->
<p lang="english" data-fault="vault.lang-parts">Breakfast is included.</p>
<!-- fault: vault.table-headers: a 4 by 4 data table with no header cells -->
<table data-fault="vault.table-headers">
<tr><td>Dorm</td><td>8 beds</td><td>€18</td><td>Shared</td></tr>
<tr><td>Twin</td><td>2 beds</td><td>€44</td><td>Private</td></tr>
<tr><td>Double</td><td>1 bed</td><td>€48</td><td>Private</td></tr>
<tr><td>Family</td><td>4 beds</td><td>€80</td><td>Private</td></tr>
</table>
<!-- fault: vault.progress-name: a progress bar with no name -->
<div role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" data-fault="vault.progress-name"></div>
</main>
<!-- fault: vault.landmarks: content outside every landmark -->
<div data-fault="vault.landmarks">Open all year.</div>
<footer><a href="index.html">Home</a></footer>
</body>
</html>
