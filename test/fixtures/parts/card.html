<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>card</title>
<!-- Three cards, each two actions on one tap target, so vault.one-target fails three times: a card link holding a
     Compare button; a card whose title link stretches over it (an ::after laid over the whole card) under a Save button
     lifted above that; and such a card with its Share button flush in a corner, so two of its sides touch nothing. -->
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222 }
  .card { display: block; width: 300px; padding: 24px; margin: 0 0 16px; border: 1px solid #767676; border-radius: 8px; color: inherit; text-decoration: none }
  .stretch { position: relative }
  .stretch a::after { content: ''; position: absolute; inset: 0 }
  .stretch button { position: relative; z-index: 1 }
  .stretch .corner { position: absolute; top: 0; right: 0 }
  button { padding: 10px 16px; font: inherit }
</style>
<a class="card" href="#hostel-a"><h3>Hostel A</h3><p>From €18 a night</p><button>Compare</button></a>
<div class="card stretch"><h3><a href="#hostel-b">Hostel B</a></h3><p>From €22 a night</p><button>Save</button></div>
<div class="card stretch"><h3><a href="#hostel-c">Hostel C</a></h3><p>From €25 a night</p><button class="corner">Share</button></div>
