<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>clean</title>
<!-- One action on every tap target, so vault.one-target passes: nav links, a whole-card link holding no control
     (its badge is part of it), a checkbox in its label, a field with a label of its own, a summary, two buttons
     side by side, a link in the text's colour, a static note in a box of its own, and a close button grown under
     (pointer: coarse), which the phone width's touch screen matches (#190). The whole page sits in an app root
     given a click listener, as a framework delegating every click does, which makes nothing actable. Listed
     as nothing: a band as wide as the page, a heading ruled on one side, a fill matching what is behind it, and
     every element a reset's `*:hover` rule selects. -->
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222 }
  nav a { color: #0a3542; margin-right: 16px }
  .card { display: block; width: 300px; padding: 24px; border: 1px solid #767676; border-radius: 8px; color: inherit; text-decoration: none }
  .note { display: inline-block; background: #f1ead8; padding: 4px 12px }
  .btn { background: #0a3542; color: #fff; border: 0; padding: 10px 20px; font: inherit }
  .badge { background: #e0a000; padding: 2px 6px }
  .band { background: #0a3542; color: #fff; margin: 0 -16px; padding: 16px }
  .ruled { border-bottom: 1px solid #767676 }
  .plain { background: #fff }
  .quiet { color: #222 }
  label[for] { cursor: pointer }
  *:hover { transition: none }
  .close { width: 20px; height: 20px; padding: 0 }
  @media (pointer: coarse) { .close { width: 44px; height: 44px } }
</style>
<div id="app">
  <nav><a href="#rooms">Rooms</a><a href="#rates">Rates</a></nav>
  <div class="band">A small house by the sea</div>
  <h3 class="ruled">Where to stay</h3>
  <a class="card" href="#hostel-a"><h3>Hostel A <span class="badge">New</span></h3><p>From €18 a night</p></a>
  <p class="plain">Rooms from €18 a night</p>
  <p><label for="mail">Email</label> <input id="mail" type="email"></p>
  <p><label><input type="checkbox"> Send me news</label></p>
  <details><summary>Opening hours</summary><p>Nine to five</p></details>
  <p class="note">Breakfast is included.</p>
  <p><button class="btn">−</button><button class="btn">+</button></p>
  <button class="btn">Book a bed</button>
  <button class="close">×</button>
  <p>Read <a class="quiet" href="#terms">the terms</a> first.</p>
</div>
<script>document.getElementById('app').addEventListener('click', () => {});</script>
