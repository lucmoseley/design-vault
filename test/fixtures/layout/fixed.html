<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<meta name="viewport" content="width=600, maximum-scale=1.5">
<title>fixed</title>
<!-- The last viewport meta sets the layout, fixed 600 px wide: shrunk on a narrower phone, stretched on a wider.
     Zoom is blocked twice over, once in each meta, as W3C ACT rule b4f0c3 tests each (#229). -->
<style>
  body { margin: 0; font: 16px/1.5 sans-serif }
  main { padding: 16px; max-width: 60ch }
</style>
<main><p>A small house by the sea.</p></main>
