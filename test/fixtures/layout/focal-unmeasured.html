<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>focal unmeasured</title>
<!-- Arts the check cannot model: a transformed img, a box with two
     background images, one whose background repeats as round, and a
     <picture> that loads a file half the size below 410 px. One more, hidden
     at every width, is shown at none. -->
<style>
  body { margin: 0; overflow-x: hidden }
  .turned { display: block; width: 100%; height: 200px; object-fit: cover; transform: rotate(2deg) }
  .two { height: 200px; background: url(focal-art.svg), url(focal-art.svg) }
  .round { height: 200px; background: url(focal-art.svg) 0 0 / 300px round }
  .swap { display: block; width: 100% }
  .gone { display: none }
</style>
<img class="turned" src="focal-art.svg" alt="">
<div class="two"></div>
<div class="round"></div>
<picture><source media="(min-width: 410px)" srcset="focal-art.svg"><img class="swap" src="focal-art-small.svg" alt=""></picture>
<img class="gone" src="focal-art.svg" alt="">
