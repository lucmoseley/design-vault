<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>touch</title>
<!-- Sideways scroll at phone widths only: a strip 900 px wide under (pointer: coarse), which only the phone band's
     touch screen matches (#190), and 300 px wide elsewhere. -->
<style>
  body { margin: 0; font: 16px/1.5 sans-serif }
  .strip { width: 300px; height: 40px; background: #0a3542 }
  @media (pointer: coarse) { .strip { width: 900px } }
</style>
<div class="strip"></div>
<p>A small house by the sea.</p>
