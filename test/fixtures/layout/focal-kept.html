<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>focal kept</title>
<!-- The cover hero of focal-cover.html, positioned 50 px short of its right
     end, keeps the focal box in view at every width; so do a background
     sized to contain the art and one 400 px tall set 10 px from the right. -->
<style>
  body { margin: 0 }
  .hero { display: block; width: 100%; height: 400px; object-fit: cover; object-position: calc(100% - 50px) 50% }
  .band { height: 400px; background: url(focal-art.svg) center / contain no-repeat }
  .edge { height: 400px; background: url(focal-art.svg) right 10px center / auto 400px no-repeat }
</style>
<img class="hero" src="focal-art.svg" alt="">
<div class="band"></div>
<div class="edge"></div>
