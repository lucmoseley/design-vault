<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>contrast</title>
<!-- One fault, vault.contrast: grey #aaaaaa body text, placeholder and a "New" label generated by ::before on white,
     2.32:1 where 4.5:1 is needed; the dark quote marks generated around the last line pass.
     The 32 px regular heading and the 20 px bold lead are #949494, 3.03:1, which passes at their size, and the
     caption on the dark band is white at 5.99:1. -->
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222 }
  h1 { font-size: 32px; font-weight: 400; color: #949494 }
  .faint { color: #aaaaaa }
  .lead { font-size: 20px; font-weight: 700; color: #949494 }
  .band { background: #446688; padding: 16px }
  .band p { color: #fff; margin: 0 }
  input { border: 1px solid #222; font: inherit }
  input::placeholder { color: #aaaaaa }
  .new::before { content: "New"; color: #aaaaaa; margin-right: 8px }
  .quote::before { content: open-quote } .quote::after { content: close-quote }
</style>
<h1>A heading in light grey</h1>
<p class="lead">A bold lead in light grey</p>
<p class="faint">Grey text too faint to read on white.</p>
<p>Ordinary dark text that reads well.</p>
<div class="band"><p>White text on a dark band</p></div>
<p><input id="q" type="search" placeholder="Search beds" aria-label="Search"></p>
<p class="new">Beds from 12 euros a night</p>
<p class="quote">A quote that reads well</p>
