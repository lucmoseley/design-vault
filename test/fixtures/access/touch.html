<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>touch</title>
<!-- One fault, vault.target-size, at desktop width only: two 20 px buttons 2 px apart, so the 24 px circles on
     them cross, one grown to 44 px under (pointer: coarse) and one under (hover: none), both of which the phone
     width's touch screen matches (#190). -->
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222 }
  .tools { display: flex; gap: 2px }
  .tools button { appearance: none; border: 0; padding: 0; width: 20px; height: 20px; background: #222 }
  @media (forced-colors: active) { .tools button { border: 1px solid } }
  @media (pointer: coarse) { .tools .bold { width: 44px; height: 44px } }
  @media (hover: none) { .tools .italic { width: 44px; height: 44px } }
</style>
<p>Two small tools side by side, grown for a finger.</p>
<div class="tools"><button class="bold" aria-label="Bold"></button><button class="italic" aria-label="Italic"></button></div>
