<!-- resting.html with each skip link shown on focus in #999 on white, 2.85:1: vault.contrast reads both
     focused and fails them, and every other question passes; the second's generated arrow cannot be measured (#421). -->
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; color: #222; background: #fff }
  :focus-visible { outline: 3px solid #b3261e; outline-offset: 2px }
  .clip { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap }
  .clip:focus { width: auto; height: auto; padding: 8px; clip-path: none; overflow: visible }
  .away { position: absolute; left: -9999px; top: 4px }
  .away:focus { left: 8px; padding: 8px }
  .clip, .away { color: #999; background: #fff; z-index: 1 }
  .away::after { content: " \2192" }
  nav a { display: inline-block; padding: 8px }
  a { color: #0a3542 }
  main, footer { padding: 16px }
</style>
<a class="clip" href="#main">Skip to main content</a>
<a class="away" href="#foot">Skip to contact details</a>
