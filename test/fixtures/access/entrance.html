<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>entrance</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; color: #222; background: #fff }
  main { padding: 16px }
  h1 { opacity: 0; transition: opacity 800ms }
  h1.in { opacity: 1 }
</style>
<main>
  <h1>Rooftop bar</h1>
</main>
<script>
  setTimeout(() => document.querySelector('h1').classList.add('in'), 300);
  let ticks = 0;
  setInterval(() => { ticks++; }, 1000);
  const query = new URLSearchParams(location.search);
  if (query.has('idle_timeout_ms')) setTimeout(() => { ticks = 0; }, Number(query.get('idle_timeout_ms')));
  if (query.has('rearming_timeout')) (function tick() { ticks++; setTimeout(tick, 1000); })();
</script>
</html>
