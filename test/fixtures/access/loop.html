<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>loop</title>
<!-- One fault, vault.pause: a square pulsing forever from load, and no control on the page at all. -->
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222 }
  .pulse { width: 40px; height: 40px; background: #0a3542; animation: pulse 1.5s ease-in-out infinite alternate }
  @keyframes pulse { to { transform: scale(0.6) } }
</style>
<p>Beds by the sea.</p>
<div class="pulse"></div>
