<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>carousel paused</title>
<!-- vault.pause (#545): carousel.html with a Pause button that stops it, which passes, declared or not.
     -->
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; color: #222; background: #fff }
  main { padding: 16px }
  button { font: inherit; padding: 8px 12px; margin: 8px 0; color: #fff; background: #0a3542; border: 1px solid transparent }
  .slides { position: relative; width: 300px; height: 120px; border: 1px solid #767676 }
  .slide { position: absolute; inset: 0; padding: 16px; opacity: 0; transition: opacity 300ms }
  .slide.on { opacity: 1 }
</style>
<main>
  <div class="slides">
    <div class="slide on"><p>Rooftop bar.</p></div>
    <div class="slide"><p>Pool.</p></div>
    <div class="slide"><p>Garden.</p></div>
  </div>
  <button class="pause">Pause</button>
</main>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  let at = 0;
  const turning = setInterval(() => {
    slides[at].classList.remove('on');
    at = (at + 1) % slides.length;
    slides[at].classList.add('on');
  }, 3000);
  document.querySelector('.pause').addEventListener('click', () => clearInterval(turning));
</script>
</html>
