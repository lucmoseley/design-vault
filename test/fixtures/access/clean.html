<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>clean</title>
<!-- Passes every question: dark text, white on a dark band, a field edged at #767676 (4.54:1), a dark-filled field with
     no border, a borderless field in a box edged at #767676, a select that draws no edge, a link underlined in prose, a link told by bold, a black link in grey text at 4.62:1
     that underlines on hover and takes the browser's focus ring, nav links with no underline (no text around them),
     a 44 px button with a transparent border for forced colours and its fill clipped inside it, keeping the browser's ring (#424), a lone 16 px icon button (WCAG 2.5.8's spacing exception), and two small links on consecutive lines
     of text and two of the browser's own checkboxes, and an unstyled select, button and date input stacked and centred with no gap
     (#188), each close enough to fail 2.5.8 but for its exemptions.
     A skip link fades in on focus and leads to the main element. A checkbox hidden for a screen reader shows its focus and its state on the box drawn
     beside it. The filled buttons and the photo link carry a transparent border for forced colours to paint.
     The nav is a fixed header, with scroll-padding to keep focus out from under it, and the page scrolls smoothly. The keyboard reaches a div with
     role=button and a tab stop, and the arrow with its own click handler inside another, the second of two radios
     and of two tabs through the first (arrow keys move between them), neither a hidden menu's link nor a part set
     off the page, a label with a click handler through the field it names, a photo
     link taken out of the tab order because the nav's Rooms link goes to the same place, and a card that acts on a
     click through the link it holds, whose focus shows as an outline on the card, in a red no link or fill on the page draws. A square spins forever, and the Pause button stops it. -->
<style>
  html { scroll-padding-top: 72px; scroll-behavior: smooth }
  body { margin: 0; padding: 72px 16px 16px; font: 16px/1.5 sans-serif; color: #222; background: #fff }
  nav { position: fixed; z-index: 1; top: 0; left: 0; right: 0; padding: 0 16px; background: #fff }
  nav a { color: #0a3542; text-decoration: none; margin-right: 16px; display: inline-block; padding: 12px 0 }
  .band { background: #446688; padding: 16px; color: #fff }
  .edged { border: 1px solid #767676; background: #fff; width: 200px; height: 36px; padding: 0 8px; font: inherit }
  .boxed { display: flex; align-items: center; gap: 8px; width: 240px; height: 44px; padding: 0 8px; border: 1px solid #767676 }
  .boxed input { border: 0; height: 30px; width: 100%; font: inherit }
  .bare { border: 0; background: transparent; font: inherit }
  .filled { border: 0; background: #0a3542; color: #fff; width: 200px; height: 36px; padding: 0 8px; font: inherit }
  .book { appearance: none; border: 1px solid transparent; background: #0a3542; background-clip: padding-box; color: #fff; height: 44px; padding: 0 16px; font: inherit }
  .close { appearance: none; border: 1px solid transparent; padding: 0; width: 16px; height: 16px; background: #222; background-clip: padding-box; margin: 24px }
  p a { color: #0a3542 }
  .strong { text-decoration: none; font-weight: 700 }
  .small { font-size: 12px; line-height: 14px }
  .grey { color: #767676 }
  .grey a { color: #000; text-decoration: none }
  .grey a:hover { text-decoration: underline }
  .ticks label { display: block; line-height: 16px }
  .ticks input { margin: 0 4px 0 0 }
  .natives { display: inline-grid; justify-items: center; align-items: start }
  .chip { display: inline-block; padding: 10px 16px; border: 1px solid #767676 }
  .skip { position: absolute; z-index: 2; left: 16px; top: 0; padding: 8px; background: #000; color: #fff; opacity: 0; transition: opacity 0.3s }
  .skip:focus { opacity: 1 }
  .hide { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0) }
  .tick { display: inline-block; width: 24px; height: 24px; border: 2px solid #444; vertical-align: middle }
  .hide:checked + .tick { background: #444 }
  .hide:focus-visible + .tick { outline: 3px solid #000; outline-offset: 2px }
  .drawer { visibility: hidden }
  .away { position: absolute; left: -9999px; width: 40px; height: 40px }
  .photo { display: block; width: 48px; height: 48px; border: 1px solid transparent; background: #446688 }
  .card { padding: 16px; border: 1px solid #767676 }
  .card a { display: inline-block; padding: 12px 0 }
  .card:focus-within { outline: 2px solid #b3261e }
  .card a:focus { outline: none }
  .spin { width: 40px; height: 40px; margin: 16px 0; background: #0a3542; animation: spin 2s linear infinite }
  .still .spin { animation-play-state: paused }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
<a class="skip" href="#main">Skip to the rooms</a>
<nav><a href="#a">Rooms</a><a href="#b">Rates</a></nav>
<main id="main">
<div class="band">White text on a dark band</div>
<p>Read <a href="#rates">our rates</a> or <a class="strong" href="#faq">the questions</a> before you book.</p>
<p class="grey">See <a href="#map">the map</a> to find us.</p>
<p><label>Name <input class="edged" type="text"></label></p>
<p><label>Email <input class="filled" type="email"></label></p>
<label class="boxed">Find <input type="search"></label>
<p><label>Sort <select class="bare"><option>Newest first</option></select></label></p>
<div class="ticks"><label><input type="checkbox"> Send me news</label><label><input type="checkbox"> Send me offers</label></div>
<div class="natives"><select aria-label="Sort"><option>Newest first</option></select><button>Go</button><input type="date" aria-label="Arrival"></div>
<button class="book">Book a bed</button>
<button class="close" aria-label="Close"></button>
<p class="small">Terms: <a href="#terms">terms</a><br>Privacy: <a href="#privacy">privacy</a></p>
<div class="chip" role="button" tabindex="0" onclick="this.classList.toggle('on')">Show dorms only</div>
<div class="chip" role="button" tabindex="0">Sort by price <span class="arrow">&darr;</span></div>
<p><label><input type="radio" name="room" checked> Dorm</label> <label><input type="radio" name="room"> Private</label></p>
<div role="tablist" aria-label="Rooms"><button class="book" role="tab" aria-selected="true">Dorms</button> <button class="book" role="tab" tabindex="-1">Privates</button></div>
<div class="drawer"><a href="#close">Close the menu</a></div>
<div class="away" onclick=""></div>
<a class="photo" href="#a" tabindex="-1" aria-hidden="true"></a>
<p><label><input class="hide" type="checkbox"><span class="tick"></span> Breakfast</label></p>
<p><label class="tap" for="nights">Nights</label> <input id="nights" class="edged" type="number" value="2"></p>
<div class="card" onclick="location.hash = 'c'"><p>A private room for two.</p><a href="#c">Room details</a></div>
<div class="spin"></div>
<button class="book" type="button" onclick="document.body.classList.toggle('still')">Pause</button>
</main>
<script>
  document.querySelector('.arrow').addEventListener('click', () => {});
  document.querySelector('.tap').addEventListener('click', () => {});
  const tabs = [...document.querySelectorAll('[role=tab]')];
  for (const t of tabs) t.addEventListener('keydown', (e) => {
    const by = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (!by) return;
    const next = tabs[(tabs.indexOf(t) + by + tabs.length) % tabs.length];
    for (const o of tabs) { o.setAttribute('aria-selected', String(o === next)); o.tabIndex = o === next ? 0 : -1; }
    next.focus();
  });
</script>
