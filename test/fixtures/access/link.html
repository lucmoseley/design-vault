<!-- Two faults. vault.colour-script, three times: a #2563eb link with no underline in #333333 text, 2.44:1 against
     it, and two more whose cues do not show: a white background on the page's own white, and a clear outline and
     shadow. In #767676 text, two black links at 4.62:1 pass on that alone, though one adds no cue on hover and one
     none on focus: G183 asks for neither (#190). And vault.focus, twice: the clear outline and the
     outline taken off on focus leave those two links no focus indicator at all. A link bold or italic only by the
     <strong> or <em> around it passes on that cue, read against the paragraph's regular text (G183). -->
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #333333 }
  a { color: #2563eb; text-decoration: none }
  .grey { color: #767676 }
  .grey a { color: #000 }
  .grey .nofocus:hover { text-decoration: underline }
  .grey .nofocus:focus { outline: none }
</style>
