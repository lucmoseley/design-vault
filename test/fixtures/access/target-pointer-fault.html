<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>target-pointer-fault</title>
<!-- vault.coarse-target's faults, one for each branch, each marked with the record's id: a button that stays
     mouse-sized, 24 px tall, under a coarse pointer, and one a (pointer: fine) rule shrinks below its layout's 44 px,
     behind a transition.
     The rest meets the record: a link in running prose, a skip link hidden at rest, a checkbox inside a 44 px
     label, and a button grown to 44 px under (pointer: coarse). -->
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222 }
  .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%) }
  button { appearance: none; border: 0; padding: 0; background: #222; color: #fff; width: 24px; height: 24px }
  #coarse-target { width: 60px }
  #coarse-target-fine { width: 44px; height: 44px; transition: width 1s, height 1s }
  @media (pointer: fine) { #coarse-target-fine { width: 20px } }
  .grown { width: 24px; height: 24px }
  @media (pointer: coarse) { .grown { width: 44px; height: 44px } }
  .tick { display: inline-flex; align-items: center; min-height: 44px; padding-inline: 8px }
</style>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <p>Read the <a href="#terms">booking terms</a> before you pay.</p>
  <button id="coarse-target" aria-label="Close"></button>
  <button id="coarse-target-fine" aria-label="Menu"></button>
  <button class="grown" aria-label="Search"></button>
  <label class="tick"><input type="checkbox"> Breakfast</label>
</main>
