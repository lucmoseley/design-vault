<!doctype html>
<html><head><style>
body { margin: 0; background: #f4efe4; }
#box { position: absolute; top: 40px; left: 0; width: 80px; height: 80px; background: #2a2a2a; }
</style></head>
<body>
<div id="box"></div>
<script>
const slide = document.getElementById("box").animate(
  [{ transform: "none" }, { transform: "translateX(400px)" }], { duration: 3000, fill: "both" });
slide.pause();
const began = performance.now();
const tick = (now) => {
  slide.currentTime = Math.min(3000, now - began);
  if (now - began < 3000) requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
</script>
</body></html>
