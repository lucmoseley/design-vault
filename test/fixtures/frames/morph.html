<!doctype html>
<!-- A path whose d a requestAnimationFrame loop rewrites (#546): check-flow
     measures such a morph, but no seek places it. -->
<html><head><style>body { margin: 0; background: #f4efe4; }</style></head>
<body>
<svg width="400" height="200" viewBox="0 0 400 200">
  <path id="wave" fill="#2a2a2a" d="M0 100h400v100H0z"/>
</svg>
<script>
const wave = document.getElementById("wave");
const began = performance.now();
const tick = (now) => {
  const t = Math.min(1, (now - began) / 3000);
  wave.setAttribute("d", "M0 100Q200 " + (100 - t * 80) + " 400 100v100H0z");
  if (t < 1) requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
</script>
</body></html>
