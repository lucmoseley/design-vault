<!doctype html>
<html><head><style>
body { margin: 0; background: #f4efe4; }
#box { position: absolute; top: 40px; left: 0; width: 80px; height: 80px; background: #2a2a2a; }
</style></head>
<body>
<div id="box"></div>
<script>
const box = document.getElementById("box");
const began = performance.now();
const tick = (now) => {
  const t = Math.min(1, (now - began) / 3000);
  box.style.transform = "translateX(" + t * 400 + "px)";
  if (t < 1) requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
</script>
</body></html>
