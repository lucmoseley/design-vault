<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Hostel: your email</title>
<link rel="icon" href="dom-icons/favicon.ico" sizes="48x48">
<link rel="icon" href="dom-icons/favicon.svg" sizes="any" type="image/svg+xml">
<link rel="apple-touch-icon" href="dom-icons/touch-180.png">
<style>body { font: 16px/1.5 sans-serif; margin: 0 16px; } label, input { display: block; }</style>
</head>
<body>
<header><p>Sea Hostel</p></header>
<main>
<form action="/email">
<label for="email"><h1>What is your email address?</h1></label>
<input id="email" name="email" type="email" autocomplete="email" enterkeyhint="done">
<button>Continue</button>
</form>
</main>
<footer><p>Sea Hostel, 1 Beach Road</p></footer>
</body>
</html>
